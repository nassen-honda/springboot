# Spring Boot の設定（自動生成 / auto-generated）
# 設定（プロジェクト → コード生成 → Java / 接続先 / ログ出力）から生成されました。手動編集は再生成で失われます。

# ===== Java =====
server.port=8080
spring.application.name=CEM\u30B7\u30B9\u30C6\u30E0
# 実行環境：開発（設定 → コード生成 → Java の「実行環境」、またはツール バーで切り替える）
app.dev=true
# 一覧画面を開いた時点で検索する
app.list.search-on-open=false
# 画面テンプレート（src/main/resources/templates/screen/*.tpl）の拡張子
spring.thymeleaf.suffix=.tpl
# セッションの有効時間（コードの Session 型）
server.servlet.session.timeout=30m
# セッション ID は Cookie だけで扱う（URL に ;jsessionid= を付けない。画面の部分更新でフォームの action が変わらないようにする）
server.servlet.session.tracking-modes=cookie
# アップロードの部品で送れるファイルの大きさ（1 ファイル / 1 回の送信の合計。Spring Boot の既定は 1MB）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===== JPA / Hibernate =====
# テーブルはこのツールの DDL で作る（Hibernate に作成・変更・削除させない。H2 のメモリ DB の既定 create-drop も止める）
spring.jpa.hibernate.ddl-auto=none
# テーブル・列の名前は Entity の @Table / @Column のとおりに使う（Spring Boot の既定は CreateDate → create_date に変えるため、テーブル定義の名前と合わなくなる）
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# 画面の表示中は DB の接続を持たない（Entity に遅延読み込みの関連がないため不要。起動時の警告も止める）
spring.jpa.open-in-view=false
# 日時は東京時間で保存・読み込みする（サーバーのタイムゾーンが UTC でもずれないようにする）
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
# 多くの行の保存をまとめて送る
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# DB の接続の数（接続プール）
spring.datasource.hikari.maximum-pool-size=10

# ===== コードの DB の処理 =====
# LoadForUpdate の行ロックの待ち時間（秒。表ごとは script.db.lock-timeout.Entity のクラス名）
script.db.lock-timeout=10
# 実行した検索（For Each 表・データプロバイダー）・件数・時間をログに出す
script.sql.log=false

# ===== 接続先（デフォルト：接続先、Oracle） =====
DB.HOST=192.168.100.101
DB.port=1521
DB.ServiceName=orclpdb
DB.username=gu
DB.password=nassen1234
spring.datasource.url=jdbc:oracle:thin:@//${DB.HOST}:${DB.port}/${DB.ServiceName}
spring.datasource.username=${DB.username}
spring.datasource.password=${DB.password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# ===== ログ出力 =====
# 出力先・レベルは logback-spring.xml で設定する（下の値を <springProperty> で参照）
LOG_DIR_APP=C:/logs/app.log
LOG_LEVEL_APP=INFO
LOG_DIR_JDBC=C:/logs/JDBC.log
LOG_LEVEL_JDBC=INFO
# 開発：コードの Log(LogLevel.Debug, …) も出す。ブラウザー側の Log もサーバーのログに出す（script/ScriptBrowserLog.java）
logging.level.script=DEBUG
script.log.browser=true
# ステップ実行（設定 → コード生成 → Java の「ステップ実行」）：IDE が待ち受けるポート（script/ScriptDebug.java）
script.debug.port=5890

